<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelloJob CRM - Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="container">
        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="margin: 0;">📊 Tổng quan Hệ thống</h1>
                <p style="color: #64748b; margin-top: 4px; font-size: 14px;">Chào mừng bạn trở lại với HelloJob CRM.</p>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <!-- Nút mở Modal -->
                <button onclick="openAddModal()" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                    ➕ Thêm ứng viên
                </button>
                <div style="background: #DBEAFE; color: #1D4ED8; padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600;">
                    👤 Admin
                </div>
            </div>
        </div>
                <!-- 4 Ô METRICS -->
        <div class="metrics-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px;">
            <div class="card" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #64748b; font-size: 14px; font-weight: 600;">👥 Tổng ứng viên</span>
                    <span style="color: #10b981; font-size: 12px; font-weight: bold;" id="growthTotal">+0%</span>
                </div>
                <h2 style="margin: 8px 0; font-size: 28px; color: #1e293b;" id="metricTotal">0</h2>
                <div style="height: 40px;"><canvas id="sparklineTotal"></canvas></div>
            </div>

            <div class="card" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #64748b; font-size: 14px; font-weight: 600;">✅ Đã tuyển</span>
                    <span style="color: #10b981; font-size: 12px; font-weight: bold;" id="growthHired">+0%</span>
                </div>
                <h2 style="margin: 8px 0; font-size: 28px; color: #1e293b;" id="metricHired">0</h2>
                <div style="height: 40px;"><canvas id="sparklineHired"></canvas></div>
            </div>

            <div class="card" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #64748b; font-size: 14px; font-weight: 600;">📈 Tỷ lệ tuyển</span>
                </div>
                <h2 style="margin: 8px 0; font-size: 28px; color: #1e293b;" id="metricRate">0%</h2>
                <div style="height: 40px;"><canvas id="sparklineRate"></canvas></div>
            </div>

            <div class="card" style="padding: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span style="color: #64748b; font-size: 14px; font-weight: 600;">❌ Từ chối</span>
                </div>
                <h2 style="margin: 8px 0; font-size: 28px; color: #1e293b;" id="metricRejected">0</h2>
                <div style="height: 40px;"><canvas id="sparklineRejected"></canvas></div>
            </div>
        </div>
        <!-- Bộ lọc -->
        <div class="card" style="margin-bottom: 20px;">
            <h3 style="margin-top: 0; margin-bottom: 15px; color: #475569;">🔍 Bộ lọc tìm kiếm</h3>
            <div class="filters">
                <select id="filterVisa">
                    <option value="Tất cả">Tất cả Visa</option>
                    <option value="Visa Kỹ sư">Visa Kỹ sư</option>
                    <option value="Visa Tokutei">Visa Tokutei</option>
                    <option value="Thực tập sinh">Thực tập sinh</option>
                </select>
                <select id="filterLocation">
                    <option value="Tất cả">Tất cả Địa điểm</option>
                    <option value="Tokyo">Tokyo</option>
                    <option value="Osaka">Osaka</option>
                </select>
                <input type="text" id="filterKeyword" placeholder="Tìm kiếm từ khóa...">
                <button onclick="loadData()">🔍 Lọc dữ liệu</button>
            </div>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #475569;">📋 Danh sách Ứng viên</h3>
            </div>
            <table id="candidateTable">
                <thead>
                    <tr>
                        <th>ID</th><th>Người đăng</th><th>Visa</th><th>Ngành nghề</th><th>Địa điểm</th><th>Trạng thái</th><th>Hành động</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- ===== MODAL THÊM ỨNG VIÊN (QUAN TRỌNG) ===== -->
    <div class="modal-overlay" id="addModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div class="modal-content" style="background: white; width: 500px; max-width: 90%; border-radius: 12px; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto;">
            <button onclick="closeAddModal()" style="position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; border: none; background: none; color: #64748b;">&times;</button>
            <h2 style="margin-top: 0; color: #1e293b;">➕ Thêm Ứng viên Mới</h2>
            
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                <input type="text" id="addName" placeholder="Tên người đăng (Bắt buộc)" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <select id="addVisa" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="">-- Chọn Visa --</option>
                    <option value="Visa Kỹ sư">Visa Kỹ sư</option>
                    <option value="Visa Tokutei">Visa Tokutei</option>
                    <option value="Thực tập sinh">Thực tập sinh</option>
                </select>
                <input type="text" id="addIndustry" placeholder="Ngành nghề" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="addLocation" placeholder="Địa điểm" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="addJapanese" placeholder="Trình độ tiếng Nhật (N5-N1)" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="addGender" placeholder="Giới tính" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="addUrl" placeholder="Link bài viết Facebook (nếu có)" style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <textarea id="addContent" placeholder="Nội dung gốc / Tóm tắt..." style="padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; height: 80px; resize: vertical;"></textarea>
                <button onclick="submitNewCandidate()" style="padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px;">
                    💾 Lưu Ứng viên
                </button>
            </div>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/dashboard.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
