<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HelloJob CRM - Quản lý Ứng viên</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- CSS cho Modal và Grid -->
    <style>
        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .candidate-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .candidate-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            border-color: #3b82f6;
        }
        .candidate-card h3 { margin: 0 0 10px 0; color: #1e293b; font-size: 18px; }
        .candidate-card p { margin: 5px 0; color: #64748b; font-size: 14px; }
        
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .badge-new { background: #e0f2fe; color: #0369a1; }
        .badge-contacted { background: #fef3c7; color: #92400e; }
        .badge-interview { background: #f3e8ff; color: #6b21a8; }
        .badge-hired { background: #dcfce7; color: #166534; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }

        /* Modal CSS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: white; width: 600px; max-width: 90%; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #64748b; border: none; background: none; }
        .modal-close:hover { color: #ef4444; }
        .note-section { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
        .note-textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; resize: vertical; font-family: inherit;}
        .btn-save-note { margin-top: 10px; padding: 8px 16px; background: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .history-list { margin-top: 15px; font-size: 13px; color: #475569; max-height: 150px; overflow-y: auto; }
        .history-item { padding: 8px 0; border-bottom: 1px dashed #e2e8f0; }
        .history-time { color: #94a3b8; font-size: 11px; }
    </style>
</head>
<body>
    <div id="sidebar-container"></div>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h1>👥 Quản lý Ứng viên</h1>
                <p style="color: #64748b;">Click vào từng thẻ để xem thông tin chi tiết và thêm ghi chú.</p>
            </div>
            <button onclick="exportCSV()" style="padding: 10px 20px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
                📥 Tải xuống CSV
            </button>
        </div>

        <!-- QUAN TRỌNG: Thẻ div này phải có class candidate-grid -->
        <div id="candidateGrid" class="candidate-grid"></div>
    </div>

    <!-- MODAL CHI TIẾT -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/candidates.js"></script>
</body>
</html>
