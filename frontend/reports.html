<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HelloJob CRM - Thống kê</title>
    <link rel="stylesheet" href="/css/style.css">
    <!-- Nhúng thư viện Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .chart-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #475569;
            font-size: 16px;
        }
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        @media (max-width: 900px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Nội dung chính -->
    <div class="container">
        <h1>📈 Thống kê Tổng quan</h1>
        <p style="color: #64748b; margin-bottom: 20px;">Cái nhìn toàn cảnh về dữ liệu ứng viên.</p>

        <div class="charts-grid">
            <div class="chart-card">
                <h3>Phân bố Trạng thái</h3>
                <div class="chart-container">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Phân bố Địa điểm (Top 10)</h3>
                <div class="chart-container">
                    <canvas id="locationChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Phân bố Ngành nghề (Top 10)</h3>
                <div class="chart-container">
                    <canvas id="industryChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>Phân bố Loại Visa</h3>
                <div class="chart-container">
                    <canvas id="visaChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- Nhúng các file JS -->
    <script src="/js/sidebar.js"></script>
    <script src="/js/reports.js"></script>
</body>
</html>
